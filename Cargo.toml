[package]
name = "shellx-drive"
version = "0.1.14"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Self-hosted cloud drive with workspaces, sharing, previews, backups, WebDAV, and desktop sync"
repository = "https://github.com/martinsbrezauckis/shellx-drive"
readme = "README.md"
publish = false
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/build.rs",
    "/docs/public/**",
    "/packaging/**",
    "/scripts/**",
    "/skill/**",
    "/src/**",
    "/web/**",
]
keywords = ["self-hosted", "cloud-storage", "webdav", "file-sharing", "sync"]
categories = ["web-programming", "filesystem"]

[lib]
name = "shellx_drive"
path = "src/lib.rs"

[[bin]]
name = "shellx-drive"
path = "src/main.rs"

[[bin]]
name = "shellx-drive-sync"
path = "src/bin/shellx-drive-sync.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
cap-fs-ext = "3.4"
cap-std = "3.4"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
rand = "0.8"
qrcodegen = "1.8"
reqwest = { version = "0.12", features = ["gzip", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicase = "2.9"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
sha2 = "0.10"
hex = "0.4"
tower = "0.5"
reqwest = { version = "0.12", features = ["cookies"] }
