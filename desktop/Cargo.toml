[workspace]
members = ["mirror-core", "src-tauri", "updater-verifier", "vendor/glib-0.18.5-rustsec-2024-0429"]
exclude = [
    "vendor/tauri-plugin-updater-2.10.1-macos-backport",
]
default-members = ["mirror-core"]
resolver = "2"

[workspace.package]
version = "0.1.14"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
keyring = "4.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5-rustsec-2024-0429" }
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater-2.10.1-macos-backport" }
